applications:
  - name: option-agent-api
    path: backend
    memory: 1G
    instances: 1
    buildpacks:
      - python_buildpack
    command: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    health-check-type: http
    health-check-http-endpoint: /health
    env:
      APP_NAME: option-agent
      APP_VERSION: 0.5.0
      ENVIRONMENT: btp
      LOG_LEVEL: INFO
      # Redis is not required. PostgreSQL is discovered automatically from
      # the Cloud Foundry VCAP_SERVICES binding.
      AUTO_START_PIPELINE: true
