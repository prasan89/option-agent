applications:
  - name: option-agent-api
    path: backend
    memory: 1G
    instances: 1
    buildpacks:
      - python_buildpack
    command: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    health-check-type: http
    health-check-http-endpoint: /health
    env:
      APP_NAME: option-agent
      APP_VERSION: 0.3.1
      ENVIRONMENT: btp
      LOG_LEVEL: INFO
      # Pipeline stays off until Redis is bound. PostgreSQL can be discovered
      # automatically from VCAP_SERVICES when a compatible service is bound.
      AUTO_START_PIPELINE: false
